<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Golden Hour</title>
  <meta name="description" content="Is it golden or blue hour right now? Golden Hour shows you at a glance, with sunrise/sunset times and a weather-risk warning for photographers.">
  <meta name="theme-color" content="#14161a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="images/icons/icon.png" type="image/png">
  <link rel="apple-touch-icon" href="images/icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>
      <picture>
        <source srcset="images/icons/logo-light.png" media="(prefers-color-scheme: dark)">
        <img src="images/icons/logo-dark.png" alt="Golden Hour" class="logo">
      </picture>
    </h1>
  </header>
  <main>
    <section aria-labelledby="transition-heading" id="transition-section">
      <h2 id="transition-heading" class="visually-hidden">Right now</h2>
      <div id="transition-diagram" class="transition-diagram"></div>
      <p id="transition-summary" class="transition-summary" role="status"></p>
    </section>

    <section aria-labelledby="location-heading" id="location-section">
      <h2 id="location-heading">Location</h2>
      <details id="location-details" class="location-card">
        <summary id="location-summary">
          <span class="location-summary-text">Showing: <strong id="location-label"></strong></span>
          <span class="location-chevron" aria-hidden="true"></span>
        </summary>

        <div class="location-picker">
          <div class="location-actions">
            <button type="button" id="use-my-location-btn">Use my location</button>
            <span class="location-hint">Only used to show accurate times, right on your device.</span>
          </div>

          <form id="location-search-form" class="location-search">
            <label for="location-search-input">Or search for a city</label>
            <div class="location-search-row">
              <input type="text" id="location-search-input" name="q" placeholder="e.g. Tokyo" autocomplete="off">
              <button type="submit">Search</button>
            </div>
          </form>

          <ul id="location-results" class="location-results" hidden></ul>
          <p id="location-message" class="location-message" role="status" hidden></p>
        </div>
      </details>
    </section>

    <section aria-labelledby="sun-heading">
      <h2 id="sun-heading">Sun</h2>
      <light-window-card id="card-sunrise"></light-window-card>
      <light-window-card id="card-sunset"></light-window-card>
    </section>

    <section aria-labelledby="golden-heading">
      <h2 id="golden-heading">Golden hour</h2>
      <light-window-card id="card-golden-morning"></light-window-card>
      <light-window-card id="card-golden-evening"></light-window-card>
    </section>

    <section aria-labelledby="blue-heading">
      <h2 id="blue-heading">Blue hour</h2>
      <light-window-card id="card-blue-morning"></light-window-card>
      <light-window-card id="card-blue-evening"></light-window-card>
    </section>
  </main>

  <footer>
    <p>&copy; diekus 2026</p>
  </footer>

  <div id="transition-popover" class="transition-popover" role="dialog" aria-labelledby="transition-popover-title" hidden>
    <button type="button" id="transition-popover-close" class="transition-popover-close" aria-label="Close">×</button>
    <p id="transition-popover-title" class="transition-popover-title"></p>
    <dl class="transition-popover-details">
      <div><dt>Start</dt><dd id="transition-popover-start"></dd></div>
      <div><dt>End</dt><dd id="transition-popover-end"></dd></div>
      <div><dt>Progress</dt><dd id="transition-popover-progress"></dd></div>
    </dl>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
